<header class="topbar">
  <div class="brand">
    <button
      mat-icon-button
      type="button"
      class="menu-toggle"
      aria-label="Toggle navigation"
      (click)="menuToggle.emit()"
    >
      <mat-icon svgIcon="menu" />
    </button>
    <img class="logo-mark" src="/icons/logo-mark.png" alt="" height="28" />
    <img class="logo-text" src="/icons/logo-text.png" alt="Fusion Edge" height="20" />
  </div>

  @if (user()) {
    <div class="actions">
      <!-- v21: the user's name opens their profile. -->
      @if (profile) {
        <button
          type="button"
          class="user-chip"
          aria-haspopup="dialog"
          matTooltip="My Profile"
          (click)="openProfile()"
        >
          <ng-container *ngTemplateOutlet="chip" />
        </button>
      } @else {
        <div class="user-chip">
          <ng-container *ngTemplateOutlet="chip" />
        </div>
      }
      <ng-template #chip>
        <span class="avatar" aria-hidden="true">{{ initials() }}</span>
        <span class="welcome">Welcome</span>
        <strong class="user-name">{{ displayName() }}</strong>
      </ng-template>

      <button
        mat-icon-button
        type="button"
        class="sign-out"
        aria-label="Sign out"
        matTooltip="Sign out"
        (click)="signOut()"
      >
        <mat-icon svgIcon="logout" />
      </button>
    </div>
  }
</header>
