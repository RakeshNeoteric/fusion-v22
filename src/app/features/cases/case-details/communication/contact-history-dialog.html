<app-record-dialog-frame
  title="Contact History"
  [icon]="null"
  [isNew]="false"
  [cancelable]="false"
  [savable]="false"
>
  <div class="ch-head">
    <app-case-identity idPrefix="ch" />
    <button
      type="button"
      class="app-button"
      [disabled]="readOnly() || state() !== 'ready'"
      (click)="newNote()"
    >
      <span class="ch-plus" aria-hidden="true"></span>
      New Note
    </button>
  </div>

  @switch (state()) {
    @case ('loading') {
      <p role="status">Loading contact history…</p>
    }
    @case ('failed') {
      <div class="ch-failed" role="alert">
        <p>Failed to load the contact history.</p>
        <button type="button" class="app-button" (click)="load()">Try again</button>
      </div>
    }
    @default {
      <div class="form-row ch-filter">
        <div class="form-field">
          <label for="ch-type">Type</label>
          <app-select
            inputId="ch-type"
            (changed)="filter($event)"
            placeholder="All"
            allowNone
            noneValue=""
            [options]="typeOptions()"
            [value]="type()"
          />
        </div>
      </div>
      <app-link-table
        caption="Contact history"
        viewLabel="View"
        [rows]="rows()"
        [columns]="columns"
        [rowKey]="key"
        [nameOf]="name"
        (view)="view($event)"
      />
    }
  }
</app-record-dialog-frame>
